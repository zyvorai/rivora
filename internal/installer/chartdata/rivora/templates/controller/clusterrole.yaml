{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rivora.fullname" . }}-controller
  labels:
    {{- include "rivora.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["rivora.zyvor.dev"]
    resources: ["addresspools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rivora.zyvor.dev"]
    resources: ["addresspools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- if .Values.gatewayApi.enabled }}
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways"]
    verbs: ["get", "list", "watch"]
  # The IPAM reconciler adds/removes its finalizer on the Gateway itself
  # (metadata.finalizers, not /status), so it needs patch on the main resource.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status"]
    verbs: ["get", "update", "patch"]
  # The status writer reports Accepted/ResolvedRefs on routes and attachedRoutes on listeners, and
  # reads what decides them: the routes, ReferenceGrants, and namespace labels.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tcproutes", "udproutes", "referencegrants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tcproutes/status", "udproutes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- end }}
