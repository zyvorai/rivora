# Default values for the rivora chart.

image:
  rivorad:
    repository: ghcr.io/zyvorai/rivora-rivorad
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  controller:
    repository: ghcr.io/zyvorai/rivora-controller
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}

rbac:
  # If false, ClusterRole/ClusterRoleBinding objects are not created — set
  # this only if you're managing them yourself outside the chart.
  create: true

# rivorad is the per-node DaemonSet: XDP/TCX dataplane, the Service/
# EndpointSlice reconciler, and (optionally) the L2 ARP+NDP speaker.
rivorad:
  # interface is the host network interface XDP/TCX attach to. Required —
  # every node the DaemonSet schedules onto must have an interface of this
  # name (a hybrid environment with differently-named interfaces per node
  # isn't supported in v0.2; pin the DaemonSet to matching nodes via
  # nodeSelector if needed).
  interface: ""
  # xdpMode is how the XDP program attaches to that interface:
  #   generic  works on any interface, but runs after the driver and forgoes most
  #            of XDP's speed. The default, so nothing changes unless you opt in.
  #   native   runs in the NIC driver: much faster, needs driver support, and
  #            rivorad refuses to start (rather than run slowly) if it's missing.
  #   auto     try native, fall back to generic with a logged warning.
  # Check `ip -d link show <iface>`: "xdp" means native, "xdpgeneric" generic.
  xdpMode: generic
  bpfDir: /usr/local/share/rivora/bpf
  # loadBalancerClass must match controller.loadBalancerClass — both sides
  # need to agree on which Services they manage. "" manages every
  # LoadBalancer Service with no explicit spec.loadBalancerClass set.
  loadBalancerClass: ""
  workers: 2
  # speaker runs the L2 ARP+NDP responder for K8s-managed NAT VIPs.
  # Requires CAP_NET_RAW (already granted below); disable only if something
  # else on the cluster already owns ARP/NDP for these VIPs.
  speaker: true
  # Kubernetes Service semantics, by mode:
  #  - sessionAffinity: ClientIP is honoured always: a client's connections all go to
  #    one backend while the backend set is stable (the Service's timeoutSeconds is
  #    not honoured; there is no timer).
  #  - externalTrafficPolicy: Local is honoured ONLY with bgp.enabled=true AND
  #    speaker=false. The L2 speaker answers ARP/NDP from one elected node whether or
  #    not it runs the Service's pods, so honouring Local there could blackhole it; in
  #    that case Local is treated as Cluster (with a once-per-Service warning in the
  #    log). Cluster and Local both preserve the client address, since the NAT only
  #    rewrites the destination.

  # apiKey/tls configure rivorad's local HTTP API the same way the
  # standalone systemd deployment does (see README.md#securing-the-api) —
  # wired into a Secret rather than inlined directly into the DaemonSet
  # spec. The API listens on 127.0.0.1 only, so these mostly matter if
  # something in-Pod besides rivoractl needs to reach it.
  # apiKey is the admin bearer token; being set is what turns authentication on.
  # It may be a comma-separated list, which is how a key is rotated with no outage:
  # add the new key, move clients over, then remove the old one. (On the command
  # line, escape the comma or helm splits it: --set 'rivorad.apiKey=new\,old'.)
  apiKey: ""
  # apiReadOnlyKey may read the API but not change anything (drain, weight). It
  # needs apiKey to be set too; rivorad refuses to start otherwise. Also a list.
  apiReadOnlyKey: ""
  tls:
    selfSigned: false
    cert: ""
    key: ""

  securityContext:
    # eBPF programs pin their maps under /sys/fs/bpf, which the kernel
    # mounts mode 0700 — a hand-picked capability list (BPF/NET_ADMIN/
    # NET_RAW/SYS_ADMIN) isn't reliably sufficient to create pin
    # directories there across every containerd/CRI configuration (the
    # default capability baseline a runtime grants on top of an explicit
    # `add` list isn't standardized), so rivorad runs privileged — the
    # same posture real eBPF DaemonSets like Cilium's agent use.
    privileged: true
    capabilities:
      add: ["BPF", "NET_ADMIN", "NET_RAW", "SYS_ADMIN"]

  # Defaults sized for a modest VIP count; a node forwarding heavy traffic
  # or running many VIPs (each gets its own health-check goroutines) should
  # raise these. The dataplane itself is BPF/kernel-side work that doesn't
  # count against the rivorad process's own cgroup.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}

# controller is rivora-controller: the cluster-scoped IPAM Deployment.
# Unprivileged — no BPF, no hostNetwork. Safe to run more than one replica
# since it leader-elects via a Lease; extras are hot standbys, not scaled
# capacity (only the leader does any work).
controller:
  replicaCount: 2
  loadBalancerClass: ""
  workers: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # podDisruptionBudget keeps at least one replica up during voluntary node
  # drains/upgrades — without it, a node-drain that targets both replicas'
  # nodes back-to-back could leave zero controllers running (both are hot
  # standbys of a Lease-elected singleton, so even one is enough, but zero
  # means no AddressPool IPAM/Service.Status writer at all).
  # minAvailable must be < replicaCount, or a voluntary drain of the last
  # evictable replica blocks forever — lower it (or disable the PDB) if you
  # run controller.replicaCount: 1.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # networkPolicy restricts inbound traffic to the controller Pod to just
  # its /metrics,/healthz,/readyz port — it's the only port the controller
  # ever listens on. Ingress is allowed from any namespace by default (most
  # clusters run their Prometheus/monitoring stack in a separate namespace);
  # narrow via fromNamespaceSelector/fromPodSelector if yours needs it.
  # No effect unless a NetworkPolicy controller (Calico, Cilium, etc.) is
  # installed — like any other NetworkPolicy object, it's a no-op otherwise.
  networkPolicy:
    enabled: false
    fromNamespaceSelector: {}
    fromPodSelector: {}

# servicePolicy makes rivorad honour ServicePolicy objects: a per-Service health
# probe, per-source SYN rate limit and endpoint weights (see the CRD in crds/).
# The CRD ships with this chart, so it is on by default; turning it off stops
# rivorad watching ServicePolicy and drops the RBAC that lets it.
servicePolicy:
  enabled: true

# gatewayApi enables the Gateway API (Gateway + TCPRoute/UDPRoute) control
# loop on both rivorad and rivora-controller. Requires the Gateway API CRDs
# (experimental channel) to already be installed on the cluster — this
# chart does not bundle them, the same way it doesn't bundle any other
# vendor's CRDs. See README.md#gateway-api for the install command.
gatewayApi:
  enabled: false

# gatewayClass optionally creates a GatewayClass pointing at Rivora's
# controllerName, so Gateways can reference it without the cluster
# operator hand-authoring one. Only rendered when both gatewayApi.enabled
# and gatewayClass.create are true.
gatewayClass:
  create: false
  name: rivora

# bgp enables rivorad's BGP+BFD speaker: active/active ECMP HA where every
# node independently advertises a /32 (IPv4) or /128 (IPv6) host route for
# each VIP it currently has a healthy backend for. ipv6NextHop is required
# to advertise IPv6 VIPs (routerId stays the BGP identifier / IPv4
# next-hop). Off by default. See the top-level README's BGP/BFD HA section
# for the full-NAT/ECMP flow-affinity caveat before enabling this with
# mode: nat VIPs.
bgp:
  enabled: false
  asn: 0
  routerId: ""
  ipv6NextHop: ""
  # peers:
  #   - address: 10.0.0.1
  #     asn: 65000
  #     bfd: true
  peers: []
  # configSecret names an existing Secret whose bgp.yaml key holds a `bgp:` section in the static
  # config's schema. Use it for what the fields above cannot say: per-peer password (TCP MD5),
  # multihop, gracefulRestart and nodes, plus communities, localPref and aggregates. When set it
  # REPLACES asn, routerId, ipv6NextHop and peers above. Keeping passwords in a Secret keeps them
  # off the command line and out of `helm get values`. See website/docs/operations/bgp.md.
  configSecret: ""

# addressPools seeds AddressPool custom resources on install, e.g.:
#   --set addressPools[0].name=default \
#   --set addressPools[0].addresses={10.0.0.0/24}
# IPv6 pools are supported (large prefixes like /64 allocate sparsely):
#   - name: v6
#     addresses: ["2001:db8:1::/64"]
# Equivalent values-file form:
# addressPools:
#   - name: default
#     addresses:
#       - 10.0.0.0/24
#     autoAssign: true
#     avoidBuggyIPs: false
addressPools: []
