site_name: Rivora
site_description: eBPF-native load balancing for Kubernetes and bare metal.
site_url: https://zyvorai.github.io/rivora/
repo_url: https://github.com/zyvorai/rivora
repo_name: zyvorai/rivora
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/zyvor-logo.svg
  favicon: assets/zyvor-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Kubernetes: kubernetes.md
  - Gateway API: gateway-api.md
  - BGP/BFD HA: bgp.md
  - IPv6: ipv6.md
  - Helm chart: helm.md
  - Selftests and CI: selftests-ci.md
  - Roadmap: roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zyvorai/rivora
