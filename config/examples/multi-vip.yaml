# v0.2: multiple VIPs on one node. Each VIP gets its own slice of the
# shared 65537-slot Maglev table (see internal/dataplane/maglevalloc.go)
# and independent backend health/draining — the API/CLI surfaces each VIP
# separately (`rivoractl vips`, `/api/v1/vips`); `rivoractl status`/
# `/api/v1/status` only work when exactly one VIP is configured.

interface: eth0
apiListen: 127.0.0.1:9870

healthCheck:
  interval: 3s
  timeout: 1s
  failThreshold: 2
  successThreshold: 2

vips:
  - address: 10.0.0.100
    port: 80
    protocol: tcp
    mode: dsr
    backends:
      - address: 10.0.0.11
        port: 80
        mac: "aa:bb:cc:dd:ee:01"
      - address: 10.0.0.12
        port: 80
        mac: "aa:bb:cc:dd:ee:02"

  - address: 10.0.0.101
    port: 443
    protocol: tcp
    mode: nat
    backends:
      - address: 10.0.1.11
        port: 8443
      - address: 10.0.1.12
        port: 8443
