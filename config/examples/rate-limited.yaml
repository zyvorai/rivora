# Opt-in SYN-flood protection: a per-source-IP token bucket on new TCP
# connection attempts (SYN packets only). Established connections' data
# packets and all UDP traffic are unaffected. Off by default — this
# section only takes effect when `enabled: true`.
#
# perSourcePacketsPerSecond/burst describe the *effective global* rate you
# want per source IP; rivorad divides both by the number of CPUs at
# startup, since the limiter enforces its budget independently on each
# CPU (see README.md's "How it works" for why).

interface: eth0
apiListen: 127.0.0.1:9870

rateLimit:
  enabled: true
  perSourcePacketsPerSecond: 1000
  burst: 2000

healthCheck:
  interval: 3s
  timeout: 1s
  failThreshold: 2
  successThreshold: 2

vips:
  - address: 10.0.0.100
    port: 80
    protocol: tcp
    mode: nat
    backends:
      - address: 10.0.1.11
        port: 8080
      - address: 10.0.1.12
        port: 8080
