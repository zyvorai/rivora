# Sample AddressPool used by CI structural checks and as a dual-stack
# reference. Large IPv6 prefixes (host bits > 16, e.g. /64) allocate
# sparsely — see README.md "IPv6 → IPAM and AddressPool".
apiVersion: rivora.zyvor.dev/v1alpha1
kind: AddressPool
metadata:
  name: ci-ipv6
spec:
  addresses:
    - 2001:db8:ci::/64
  autoAssign: true
  avoidBuggyIPs: false
