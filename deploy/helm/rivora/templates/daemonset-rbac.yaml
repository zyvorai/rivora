{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rivora.fullname" . }}-rivorad
  labels:
    {{- include "rivora.rivorad.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- if .Values.servicePolicy.enabled }}
  - apiGroups: ["rivora.zyvor.dev"]
    resources: ["servicepolicies"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if .Values.gatewayApi.enabled }}
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tcproutes", "udproutes", "referencegrants"]
    verbs: ["get", "list", "watch"]
  # allowedRoutes namespace selectors match on namespace labels.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rivora.fullname" . }}-rivorad
  labels:
    {{- include "rivora.rivorad.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rivora.fullname" . }}-rivorad
subjects:
  - kind: ServiceAccount
    name: {{ include "rivora.rivorad.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
