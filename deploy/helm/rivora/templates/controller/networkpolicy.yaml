{{- if .Values.controller.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rivora.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rivora.controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rivora.controller.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if or .Values.controller.networkPolicy.fromNamespaceSelector .Values.controller.networkPolicy.fromPodSelector }}
        - {{- if .Values.controller.networkPolicy.fromNamespaceSelector }}
          namespaceSelector:
            {{- toYaml .Values.controller.networkPolicy.fromNamespaceSelector | nindent 12 }}
          {{- end }}
          {{- if .Values.controller.networkPolicy.fromPodSelector }}
          podSelector:
            {{- toYaml .Values.controller.networkPolicy.fromPodSelector | nindent 12 }}
          {{- end }}
        {{- else }}
        - {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 9871
{{- end }}
