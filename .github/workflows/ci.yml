name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - run: go mod tidy && git diff --exit-code go.mod go.sum
    - run: go vet ./...
    - run: go build ./cmd/rivorad ./cmd/rivoractl ./cmd/rivora-doctor ./cmd/rivora-controller
    - run: go test ./...
    - run: gofmt -l . | tee /tmp/fmt.out && [ ! -s /tmp/fmt.out ]
  helm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - run: helm lint deploy/helm/rivora --set rivorad.interface=eth0
    - run: |
        helm template rivora deploy/helm/rivora \
          --set rivorad.interface=eth0 \
          --set 'addressPools[0].name=default' \
          --set 'addressPools[0].addresses={10.0.0.0/24}' \
          > /dev/null
  bpf:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Only clang/llvm/libelf-dev are actually needed to compile the BPF
    # objects — no bpftool here (see the integration job for why
    # linux-tools-* is best avoided when it isn't actually required).
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libelf-dev
    - run: make bpf
    - uses: actions/upload-artifact@v4
      with:
        name: bpf-objects
        path: bpf/*.o
  integration:
    needs: [go, bpf]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - name: Install build deps
      # bpftool itself — not just its postinst hook — prints "bpftool not
      # found for kernel X" and exits nonzero on this runner's kernel even
      # though it's fully present and functional (confirmed: `command -v
      # bpftool` resolves it, and it works fine for the actual map
      # show/dump/update calls the selftest scripts make) — it's warning
      # about missing supplementary kernel-debug artifacts, not reporting
      # itself broken. So: `|| true` every install attempt, and don't gate
      # on `bpftool version`'s exit code either — the selftest scripts'
      # actual bpftool usage is the real, meaningful check.
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang llvm libelf-dev
        sudo apt-get install -y -qq bpftool || true
        command -v bpftool || sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || true
        command -v bpftool || sudo apt-get install -y -qq linux-tools-common linux-tools-generic || true
        command -v bpftool
        bpftool version || true
    - run: make bpf build
    - name: Functional selftest (veth/netns, DSR + full-NAT)
      run: sudo bash scripts/selftest.sh
    - name: Multi-VIP + draining selftest (veth/netns)
      run: sudo bash scripts/selftest-multivip.sh
