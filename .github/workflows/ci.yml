name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - run: go mod tidy && git diff --exit-code go.mod go.sum
    - run: go vet ./...
    - run: go build ./cmd/rivorad ./cmd/rivoractl ./cmd/rivora-doctor ./cmd/rivora-controller ./cmd/rivora
    # -race covers the product IPv6 follow-ons (IPAM sparse alloc, BGP,
    # speaker VIP selection) plus the rest of the tree in one pass.
    - run: go test -race ./...
    - run: gofmt -l . | tee /tmp/fmt.out && [ ! -s /tmp/fmt.out ]
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - run: go install golang.org/x/vuln/cmd/govulncheck@latest
    - name: govulncheck (fail only on unaccepted findings)
      run: |
        govulncheck ./... > govulncheck.out 2>&1 || true
        cat govulncheck.out
        # GO-2026-4736 (gobgp NEXT_HOP DoS) has no upstream fix yet — tracked
        # as an accepted risk in SECURITY.md. Fail the job on anything else.
        if grep -A1 '^Vulnerability #' govulncheck.out | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u | grep -v -x 'GO-2026-4736' | grep -q .; then
          echo "::error::govulncheck found vulnerabilities beyond the accepted GO-2026-4736"
          exit 1
        fi
  helm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - run: helm lint deploy/helm/rivora --set rivorad.interface=eth0
    - name: Helm template IPv4 AddressPool
      run: |
        helm template rivora deploy/helm/rivora \
          --set rivorad.interface=eth0 \
          --set 'addressPools[0].name=default' \
          --set 'addressPools[0].addresses={10.0.0.0/24}' \
          > /dev/null
    - name: Helm template IPv6 pool + BGP /128 next-hop
      run: |
        helm template rivora deploy/helm/rivora \
          --set rivorad.interface=eth0 \
          --set 'addressPools[0].name=v6' \
          --set 'addressPools[0].addresses={2001:db8::/64}' \
          --set bgp.enabled=true \
          --set bgp.asn=65001 \
          --set bgp.routerId=10.0.0.1 \
          --set bgp.ipv6NextHop=2001:db8::1 \
          --set 'bgp.peers[0].address=10.0.0.2' \
          --set 'bgp.peers[0].asn=65000' \
          | grep -q -- '-bgp-ipv6-next-hop=2001:db8::1'
    - name: Helm template Gateway API enabled
      run: |
        out=$(helm template rivora deploy/helm/rivora \
          --set rivorad.interface=eth0 \
          --set gatewayApi.enabled=true \
          --set gatewayClass.create=true)
        echo "$out" | grep -q -- '-gateway-api=true'
        echo "$out" | grep -q 'kind: GatewayClass'
    - name: Helm template PDB + NetworkPolicy
      run: |
        out=$(helm template rivora deploy/helm/rivora \
          --set rivorad.interface=eth0 \
          --set controller.networkPolicy.enabled=true \
          --set 'controller.networkPolicy.fromNamespaceSelector.matchLabels.kubernetes\.io/metadata\.name=monitoring')
        echo "$out" | grep -q 'kind: PodDisruptionBudget'
        echo "$out" | grep -q 'kind: NetworkPolicy'
        echo "$out" | grep -q 'kubernetes.io/metadata.name: monitoring'
    - name: Chart embedded in the rivora CLI is in sync (make sync-chart)
      run: make check-chart-sync
  crd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate AddressPool CRD + IPv6 sample
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
        # Structural checks (kubeconform needs an online Kubernetes JSON
        # schema CDN for CustomResourceDefinition; pin assertions here
        # instead so CI stays offline-reliable).
        python3 - <<'PY'
        import yaml
        crd = yaml.safe_load(open("deploy/helm/rivora/crds/addresspool-crd.yaml"))
        assert crd["apiVersion"] == "apiextensions.k8s.io/v1"
        assert crd["kind"] == "CustomResourceDefinition"
        assert crd["metadata"]["name"] == "addresspools.rivora.zyvor.dev"
        assert crd["spec"]["group"] == "rivora.zyvor.dev"
        assert crd["spec"]["names"]["kind"] == "AddressPool"
        ver = crd["spec"]["versions"][0]
        assert ver["name"] == "v1alpha1" and ver["served"] and ver["storage"]
        desc = ver["schema"]["openAPIV3Schema"]["properties"]["spec"]["properties"]["addresses"]["description"]
        assert "IPv6" in desc, "CRD addresses description must mention IPv6"
        sample = yaml.safe_load(open("deploy/helm/rivora/ci/addresspool-ipv6.yaml"))
        assert sample["apiVersion"] == "rivora.zyvor.dev/v1alpha1"
        assert sample["kind"] == "AddressPool"
        assert "2001:db8:ci::/64" in sample["spec"]["addresses"]
        print("AddressPool CRD + IPv6 sample OK")
        PY
  # Exercises the rivora CLI (cmd/rivora) against a real API server — a
  # kind cluster, not the veth/netns rig the integration job uses, since
  # this is testing Helm-SDK/client-go wiring, not the XDP dataplane. kind
  # nodes are containers without a stable interface name or guaranteed XDP
  # support, and the chart's default images aren't published yet (see
  # release.yml), so this deliberately stops at "the Helm release
  # installs/upgrades/uninstalls and the expected objects show up" rather
  # than asserting pods reach Ready.
  cli:
    needs: [go]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - name: Install kind + kubectl
      run: |
        kind_version="$(curl -fsSL https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)"
        curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${kind_version}/kind-linux-amd64"
        chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
        kubectl_version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
        curl -fsSLo ./kubectl "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
        chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
    - run: kind create cluster --name rivora-cli-ci --wait 120s
    - run: make build-cli
    - name: rivora install
      run: ./bin/rivora install --set rivorad.interface=eth0
    - name: rivora status (Helm objects must exist even if pods can't pull unpublished images)
      run: |
        # A brand-new cluster's CRD needs a few seconds to become API-
        # discoverable after Helm creates it — unlike the shared box this
        # was manually verified against, where the CRD already pre-existed
        # from earlier testing. Retry rather than race it.
        for i in $(seq 1 10); do
          ./bin/rivora status | tee /tmp/status.out
          grep -q 'AddressPool CRD  installed' /tmp/status.out && break
          sleep 2
        done
        grep -q 'rivorad (DaemonSet)' /tmp/status.out
        grep -q 'rivora-controller (Deployment)' /tmp/status.out
        grep -q 'AddressPool CRD  installed' /tmp/status.out
    - name: rivora upgrade
      run: ./bin/rivora upgrade --set rivorad.interface=eth0 --set controller.workers=3
    - name: rivora uninstall
      run: ./bin/rivora uninstall
    - name: confirm workloads were removed
      run: |
        # Pods take a few seconds to finish Terminating after `helm
        # uninstall` returns — confirmed manually against a live cluster
        # (an immediate check there also raced this the first time).
        for i in $(seq 1 15); do
          out="$(kubectl get all -n rivora-system 2>&1)" || true
          echo "$out" | grep -q 'No resources found' && break
          sleep 2
        done
        echo "$out"
        echo "$out" | grep -q 'No resources found'
    - if: always()
      run: kind delete cluster --name rivora-cli-ci
  bpf:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Only clang/llvm/libelf-dev are actually needed to compile the BPF
    # objects — no bpftool here (see the integration job for why
    # linux-tools-* is best avoided when it isn't actually required).
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libelf-dev
    - run: make bpf
    - uses: actions/upload-artifact@v4
      with:
        name: bpf-objects
        path: bpf/*.o
  integration:
    needs: [go, bpf]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - name: Install build deps
      # bpftool itself — not just its postinst hook — prints "bpftool not
      # found for kernel X" and exits nonzero on this runner's kernel even
      # though it's fully present and functional (confirmed: `command -v
      # bpftool` resolves it, and it works fine for the actual map
      # show/dump/update calls the selftest scripts make) — it's warning
      # about missing supplementary kernel-debug artifacts, not reporting
      # itself broken. So: `|| true` every install attempt, and don't gate
      # on `bpftool version`'s exit code either — the selftest scripts'
      # actual bpftool usage is the real, meaningful check.
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang llvm libelf-dev
        sudo apt-get install -y -qq bpftool || true
        command -v bpftool || sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || true
        command -v bpftool || sudo apt-get install -y -qq linux-tools-common linux-tools-generic || true
        command -v bpftool
        bpftool version || true
    - run: make bpf build
    - name: Functional selftest (veth/netns, DSR + full-NAT)
      run: sudo bash scripts/selftest.sh
    - name: Multi-VIP + draining selftest (veth/netns)
      run: sudo bash scripts/selftest-multivip.sh
    - name: Weighted Maglev selftest (veth/netns)
      run: sudo bash scripts/selftest-weighted.sh
    - name: Rate limit selftest (veth/netns)
      run: sudo bash scripts/selftest-ratelimit.sh
    - name: IPv6 dataplane selftest (veth/netns, DSR + full-NAT)
      run: sudo bash scripts/selftest-ipv6.sh
    - name: NDP speaker selftest (veth)
      run: sudo bash scripts/selftest-ndp.sh
    - name: Restart selftest (persisted datapath, veth/netns)
      run: sudo bash scripts/selftest-restart.sh
    - name: Restart reconciliation selftest (stale VIPs, shifted IDs, veth/netns)
      run: sudo bash scripts/selftest-adopt.sh
    - name: Drop-reason counters selftest (rate limit, no backend, unserved, veth/netns)
      run: sudo bash scripts/selftest-drops.sh
    - name: XDP attach mode selftest (generic, native, auto, mode change, veth/netns)
      run: sudo bash scripts/selftest-xdpmode.sh
